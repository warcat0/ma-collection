name: Prix du jour

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Télécharger les prix Cardmarket
        run: node scripts/maj-prix.mjs
      - name: Enregistrer
        run: |
          git config user.name "maj-prix"
          git config user.email "maj-prix@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Prix du $(date +%F)"
          git push
